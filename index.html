<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pin&amp;Play - Übersicht</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header id="main-header"></header>

    <div id="view-overview" class="container">
        <div class="detail-header">
            <h2 style="margin: 0;">Aktuelle Flipper</h2>
            <button class="btn-green" onclick="openFeedbackView()">+ Feedback geben</button>
        </div>
        <div class="grid-overview" id="user-grid">
            <p style="padding: 20px;">Lade Flipper...</p>
        </div>
    </div>

    <div id="view-feedback" class="container hidden">
        <div class="detail-header">
            <div class="detail-header-left">
                <button class="btn-back" onclick="closeFeedbackView()" title="Zurück zur Übersicht">←</button>
                <h2 style="margin: 0;">Allgemeines Feedback &amp; Vorschläge</h2>
            </div>
        </div>
        <div class="report-form">
            <label><strong>Deine Nachricht / Idee für das Pin&amp;Play</strong></label>
            <textarea id="feedback-desc" rows="6" placeholder="Was gefällt dir gut? Was können wir verbessern?"></textarea>

            <label><strong>Deine E-Mail (Für Rückfragen, freiwillig)</strong></label>
            <input type="email" id="feedback-email" placeholder="email@beispiel.de">

            <label><strong>Foto anhängen (Optional)</strong></label><br>
            <input type="file" id="feedback-file" accept="image/*" style="margin-bottom: 15px; border: none; padding: 0;">

            <button id="submit-feedback-btn" class="btn-green" style="width: 100%; padding: 14px;" onclick="submitGeneralFeedback()">Feedback absenden</button>
            <p id="feedback-status" style="display: none; margin-top: 10px; font-weight: bold; text-align: center;"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/app.js"></script>
    <script>
        function openPinball(id) {
            saveCurrentScrollPos();
            setNavOrigin('/');
            window.location.href = `/flipper/${id}`;
        }

        function renderUserGrid() {
            const grid = document.getElementById('user-grid');
            const sorted = [...pinballs].sort((a, b) => (a.isAktiv !== b.isAktiv ? (a.isAktiv ? -1 : 1) : a.name.localeCompare(b.name, 'de')));

            grid.innerHTML = sorted.map((p) => {
                const label = p.isAktiv ? '' : '<br><span style="color:var(--gold); font-size:13px; font-weight:normal;">(Derzeit nicht in Aufstellung)</span>';
                const style = p.isAktiv ? '' : 'opacity:0.45; filter:grayscale(65%);';
                const img = p.imgUrl ? `<img src="${p.imgUrl}" alt="${escHtml(p.name)}" loading="lazy">` : '';
                return `
                    <div class="flipper-card" onclick="openPinball(${p.id})" style="${style}">
                        <div class="placeholder-img">${img}</div>
                        <h3>${escHtml(p.name)}${label}</h3>
                    </div>
                `;
            }).join('');
        }

        function openFeedbackView() {
            if (!ensureWritePermission()) return;
            saveCurrentScrollPos();
            document.getElementById('view-overview').classList.add('hidden');
            document.getElementById('view-feedback').classList.remove('hidden');
            window.history.replaceState({}, '', '/feedback');
            window.scrollTo({ top: 0, behavior: 'instant' });
        }

        function closeFeedbackView() {
            document.getElementById('view-feedback').classList.add('hidden');
            document.getElementById('view-overview').classList.remove('hidden');
            window.history.replaceState({}, '', '/');
            const y = parseInt(sessionStorage.getItem('pinplay_scroll_/') || '0', 10);
            window.scrollTo({ top: y, behavior: 'instant' });
        }

        async function submitGeneralFeedback() {
            if (!ensureWritePermission()) return;
            const desc = document.getElementById('feedback-desc').value.trim();
            const email = document.getElementById('feedback-email').value.trim();
            const fileInput = document.getElementById('feedback-file');
            const statusEl = document.getElementById('feedback-status');
            const btn = document.getElementById('submit-feedback-btn');

            if (!desc) { showActionToast('Bitte gib eine Nachricht ein!', 'error'); return; }

            btn.disabled = true;
            btn.classList.add('btn-busy');
            btn.innerText = fileInput.files[0] ? '⏳ Komprimiere Foto & sende...' : '⏳ Sende Feedback...';
            statusEl.style.display = 'block';
            statusEl.style.color = 'var(--gold-l)';
            statusEl.innerText = 'Dein Feedback wird übertragen...';

            try {
                const foto = await uploadIncomingPhoto('feedback', fileInput.files[0]);
                const { error } = await db.from('feedback').insert([{ nachricht: desc, email, foto }]);
                if (error) throw error;

                if (isLoggedIn) await loadAllDatabaseData();
                btn.classList.remove('btn-busy');
                btn.innerText = '✓ Feedback gesendet!';
                statusEl.style.color = '#3fb950';
                statusEl.innerText = '✓ Vielen Dank! Dein Feedback wurde gespeichert.';
                showActionToast('✓ Vielen Dank! Dein Feedback wurde gesendet.', 'success');

                document.getElementById('feedback-desc').value = '';
                document.getElementById('feedback-email').value = '';
                fileInput.value = '';
                setTimeout(() => {
                    statusEl.style.display = 'none';
                    btn.disabled = false;
                    btn.innerText = 'Feedback absenden';
                    closeFeedbackView();
                }, 1400);
            } catch (err) {
                btn.classList.remove('btn-busy');
                btn.disabled = false;
                btn.innerText = 'Feedback absenden';
                statusEl.style.color = '#ff7b72';
                statusEl.innerText = 'Fehler beim Senden: ' + err.message;
                showActionToast('Fehler beim Senden: ' + err.message, 'error');
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await initSharedApp(() => renderUserGrid());
            renderUserGrid();
            if (window.location.pathname.replace(/\/$/, '') === '/feedback') openFeedbackView();
        });
    </script>
</body>
</html>
