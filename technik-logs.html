<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pin&amp;Play - Technik Aktivitäts-Logs</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header id="main-header"></header>

    <div class="container">
        <div class="detail-header">
            <div class="detail-header-left">
                <button class="btn-back" onclick="navigateBackTo('/')" title="Zurück zur Übersicht">←</button>
                <h2 style="margin: 0;">Technik-Center: Änderungs-Logs</h2>
            </div>
            <div class="detail-header-actions">
                <button class="btn-switch" onclick="loadLogs()">↻ Aktualisieren</button>
            </div>
        </div>

        <div id="tech-subnav" class="report-mode-tabs"></div>

        <div class="report-controls" style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
            <input type="text" id="log-search" placeholder="Suche nach Aktion, Flipper, Teil oder Person..." oninput="renderLogs()" style="flex:1; min-width:210px; margin:0; padding:9px 11px; background:var(--input); color:var(--text); border:1px solid var(--border-l); border-radius:6px;">
            <select id="log-cat" class="bold-sort-select" style="min-width:190px; margin:0;" onchange="renderLogs()">
                <option value="all">Alle Kategorien</option>
                <option value="meldung">Meldungen</option>
                <option value="highscore">Highscores</option>
                <option value="flipper">Flipper (Power/Status)</option>
                <option value="ersatzteil">Ersatzteile &amp; Bestand</option>
                <option value="account">Accounts &amp; Initialen</option>
                <option value="feedback">Feedback</option>
            </select>
        </div>

        <div id="logs-list"><p style="padding: 15px;">Lade Aktivitäts-Logs...</p></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/app.js"></script>
    <script>
        let logsDB = [];

        const CAT_META = {
            meldung: { label: 'Meldung', color: 'var(--orange)' },
            highscore: { label: 'Highscore', color: 'var(--gold)' },
            flipper: { label: 'Flipper', color: 'var(--green)' },
            ersatzteil: { label: 'Ersatzteil', color: 'var(--blue)' },
            account: { label: 'Account', color: '#a371f7' },
            feedback: { label: 'Feedback', color: '#79c0ff' }
        };

        async function loadLogs() {
            const { data, error } = await db
                .from('activity_logs')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(250);
            if (error) {
                document.getElementById('logs-list').innerHTML = `<p style="color:#ff7b72;">Fehler beim Laden der Logs: ${escHtml(error.message)}</p>`;
                return;
            }
            logsDB = data || [];
            renderLogs();
        }

        function renderLogs() {
            renderTechSubnav('tech-subnav', 'logs');
            const q = (document.getElementById('log-search').value || '').trim().toLowerCase();
            const cat = document.getElementById('log-cat').value;
            const box = document.getElementById('logs-list');

            const filtered = logsDB.filter((l) => {
                if (cat !== 'all' && l.category !== cat) return false;
                if (!q) return true;
                return `${l.summary} ${l.actor_name} ${l.category} ${l.action}`.toLowerCase().includes(q);
            });

            if (!filtered.length) {
                box.innerHTML = '<p style="color:var(--muted); padding:10px;"><i>Keine passenden Log-Einträge vorhanden.</i></p>';
                return;
            }

            box.innerHTML = filtered.map((l) => {
                const meta = CAT_META[l.category] || { label: l.category, color: 'var(--border-l)' };
                return `
                    <div class="report-comment" style="padding:11px 14px; margin-bottom:9px; border-left:4px solid ${meta.color};">
                        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
                            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                                <span class="perm-tag-pill" style="border-color:${meta.color}; color:${meta.color}; font-weight:700;">${escHtml(meta.label)}</span>
                                <strong style="color:var(--gold-l); font-size:13px;">${escHtml(l.actor_name || 'Besucher')}</strong>
                                <span style="font-size:14px; color:var(--text);">${escHtml(l.summary)}</span>
                            </div>
                            <span style="font-size:12px; color:var(--muted); white-space:nowrap;">${formatDateTime(l.created_at)}</span>
                        </div>
                    </div>`;
            }).join('');
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await initSharedApp(() => {
                if (!isLoggedIn) { redirectToLoginWithReturn(); return; }
                if (!hasPerm('view_logs')) { window.location.href = '/'; return; }
                loadLogs();
            });
            if (!isLoggedIn) { redirectToLoginWithReturn(); return; }
            if (!hasPerm('view_logs')) { showActionToast('Keine Berechtigung für Logs.', 'error'); window.location.href = '/'; return; }
            renderTechSubnav('tech-subnav', 'logs');
            loadLogs();
        });
    </script>
</body>
</html>
